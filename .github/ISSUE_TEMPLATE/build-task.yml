name: Build task
description: Already specced and mocked-up work, ready for /build
labels: ["stage:build"]
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What to build. Link the spec or plan section and the mockup screen.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable checks, written as a checklist.
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: "#12, #13"
